<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Tracker Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        #app {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .loading {
            color: white;
            text-align: center;
            font-size: 1.5em;
            margin-top: 50px;
        }

        .error {
            background: #ff4444;
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin: 20px auto;
            max-width: 600px;
        }

        table {
            width: 100%;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9em;
            letter-spacing: 1px;
        }

        tbody tr {
            border-bottom: 1px solid #f0f0f0;
            transition: background-color 0.3s ease;
        }

        tbody tr:hover {
            background-color: #f8f9fa;
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        td {
            padding: 15px;
            color: #333;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-good {
            background-color: #28a745;
            color: white;
        }

        .status-bad {
            background-color: #dc3545;
            color: white;
        }

        .website-link {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .website-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            table {
                font-size: 0.9em;
            }

            th, td {
                padding: 10px 8px;
            }

            h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <h1>📊 Project Tracker Dashboard</h1>
        <div v-if="loading" class="loading">Loading projects...</div>
        <div v-else-if="error" class="error">{{ error }}</div>
        <table v-else-if="projects.length > 0">
            <thead>
                <tr>
                    <th>Client</th>
                    <th>Needs</th>
                    <th>Deliverables</th>
                    <th>Date</th>
                    <th>Website</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="project in projects" :key="project.clients">
                    <td>{{ project.clients }}</td>
                    <td>{{ project.needs }}</td>
                    <td>{{ project.deliverables }}</td>
                    <td>{{ project.dates }}</td>
                    <td>
                        <a :href="'https://' + project.websites" 
                           target="_blank" 
                           class="website-link">
                            {{ project.websites }}
                        </a>
                    </td>
                    <td>
                        <span :class="['status-badge', project['website status'] === 'good' ? 'status-good' : 'status-bad']">
                            {{ project['website status'] }}
                        </span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
